<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Niet Café</title><meta name="theme-color" content="#5f8553">
<style>
:root{--bg:#f2f6ec;--tx:#2f4a2a;--mu:#6d8566;--g:#5f8553;--au:#b98d35;--ln:#d2dfc4;--rd:#b8453f;color-scheme:light}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px Lora,Georgia,serif}button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}header b{flex:1}
main{max-width:980px;margin:auto;padding:14px}.btn,.chip,.tb button{border:1px solid var(--ln);background:#fff;border-radius:12px;padding:8px 14px;cursor:pointer}.btn{background:var(--g);color:#fff;border:0;font-weight:700}.btn.o{background:#fff;color:var(--g);border:1px solid var(--g)}.btn.r{background:var(--rd)}.btn.s{padding:5px 10px;font-size:13px}
.on{background:var(--g)!important;color:#fff!important;border-color:var(--g)!important}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:12px;margin:8px 0}
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.tbl{padding:18px 8px;text-align:center;border-radius:16px;border:1px solid var(--ln);background:#fff;font-weight:700;cursor:pointer}.tbl.bz{background:#f6e7c8;border-color:var(--au)}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid var(--ln);cursor:pointer}.dh span{color:#9a6b1c;font-weight:700}
input,select{border:1px solid var(--ln);border-radius:10px;padding:8px;background:#fff;max-width:100%}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:14px;display:block;overflow-x:auto}th,td{padding:7px 8px;border-bottom:1px solid var(--ln);text-align:right}th:first-child,td:first-child{text-align:left}th{background:#e8f0df}
.bad{color:var(--rd);font-weight:700}.ok{color:var(--g);font-weight:700}.tk{border-left:6px solid var(--au)}.tk.cook{border-color:var(--g)}
.lg{max-width:340px;margin:60px auto;text-align:center;display:grid;gap:10px;padding:0 14px}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ВСТАВЬТЕ СВОИ ДАННЫЕ из Supabase: Project Settings -> API (Project URL и anon public key) */
const URL_='https://YOUR-PROJECT.supabase.co',KEY='YOUR-ANON-KEY';
const sb=supabase.createClient(URL_,KEY),$=s=>document.querySelector(s),M=n=>Math.round(n||0).toLocaleString('ru-RU')+'\u00a0₸';
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RN={waiter:'Официант',kitchen:'Кухня',bar:'Бар',store:'Склад',boss:'Руководитель',none:'Без роли'};
let me=null,tab='',tbl=0,cat=0,per=1,D=[],C=[],ch=null;
const q=async p=>{const r=await p;if(r.error){alert(r.error.message);throw r.error}return r.data};
const dp=id=>+(D.find(d=>d.id==id)||{}).price||0,dn=id=>(D.find(d=>d.id==id)||{}).name||'';
const hd=()=>`<header><b>${RN[me.role]} · ${E(me.name)}</b><button class="btn o s" onclick="out()">Выйти</button></header>`;
const tabs=(a,d)=>{tab=tab||d;return`<div class="row tb">${a.map(([k,n])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render()">${n}</button>`).join('')}</div>`};
function login(){$('#app').innerHTML=`<div class="lg"><h2>Niet Café</h2><input id="u" placeholder="Логин" autocapitalize="off"><input id="p" type="password" placeholder="Пароль" onkeydown="event.key=='Enter'&&go()"><button class="btn" onclick="go()">Войти</button><p id="er" class="bad"></p></div>`}
async function go(){const{error}=await sb.auth.signInWithPassword({email:$('#u').value.trim().toLowerCase()+'@niet.cafe',password:$('#p').value});if(error)return $('#er').textContent='Неверный логин или пароль';init()}
async function out(){await sb.auth.signOut();me=null;login()}
async function init(){const{data:{session}}=await sb.auth.getSession();if(!session)return login();
const{data}=await sb.from('profiles').select('*').eq('id',session.user.id).single();me=data;tab='';tbl=0;
if(!me||me.role=='none'){$('#app').innerHTML=(me?hd():'')+'<main><p>Роль не назначена. Обратитесь к руководителю.</p></main>';return}
[C,D]=await Promise.all([q(sb.from('cats').select('*').order('id')),q(sb.from('dishes').select('*').order('id'))]);cat=C[0]?C[0].id:0;
if(ch)sb.removeChannel(ch);if(['waiter','kitchen','bar'].includes(me.role))ch=sb.channel('r').on('postgres_changes',{event:'*',schema:'public',table:'order_items'},()=>render()).subscribe();render()}
async function render(){const h={waiter:wv,kitchen:()=>kv('kitchen'),bar:()=>kv('bar'),store:sv,boss:bv}[me.role];const x=await h();$('#app').innerHTML=hd()+'<main>'+x+'</main>'}
/* ---- официант ---- */
async function wv(){const busy=(await q(sb.from('orders').select('tbl').eq('status','open'))).map(x=>x.tbl);
if(!tbl)return`<div class="g2">${[...Array(20)].map((_,i)=>`<div class="tbl ${busy.includes(i+1)?'bz':''}" onclick="tbl=${i+1};render()">Стол ${i+1}</div>`).join('')}</div>`;
const o=await q(sb.from('orders').select('*,order_items(*)').eq('tbl',tbl).eq('status','open').maybeSingle()),it=o?o.order_items:[],sum=it.reduce((a,i)=>a+i.qty*dp(i.dish_id),0);
return`<button class="btn o s" onclick="tbl=0;render()">← Столы</button><h3>Стол ${tbl}</h3><div class="two"><div><div class="row">${C.map(c=>`<button class="chip ${cat==c.id?'on':''}" onclick="cat=${c.id};render()">${E(c.name)}</button>`).join('')}</div>${D.filter(d=>d.cat_id==cat).map(d=>`<div class="dh" onclick="add(${d.id})">${E(d.name)}<span>${M(d.price)}</span></div>`).join('')}</div><div class="card">${it.map(i=>`<div class="dh">${i.qty}× ${E(dn(i.dish_id))} <small>${i.status}</small>${i.status=='new'?`<button class="btn r s" onclick="del(${i.id})">×</button>`:''}</div>`).join('')||'Пусто'}<h4>Итого: ${M(sum)}</h4>${it.length?`<button class="btn" onclick="pay('cash')">Наличные</button> <button class="btn" onclick="pay('card')">Карта</button>`:''}</div></div>`}
async function add(id){let o=await q(sb.from('orders').select('id').eq('tbl',tbl).eq('status','open').maybeSingle());if(!o)o=await q(sb.from('orders').insert({tbl}).select().single());await q(sb.from('order_items').insert({order_id:o.id,tbl,dish_id:id,station:D.find(x=>x.id==id).station}));render()}
const del=async id=>{await q(sb.from('order_items').delete().eq('id',id));render()};
const pay=async m=>{const o=await q(sb.from('orders').select('id').eq('tbl',tbl).eq('status','open').single());await q(sb.from('orders').update({status:'closed',pay:m}).eq('id',o.id));tbl=0;render()};
/* ---- кухня / бар ---- */
async function kv(s){const r=await q(sb.from('order_items').select('*').eq('station',s).neq('status','ready').order('created'));
return r.map(i=>`<div class="card tk ${i.status=='cooking'?'cook':''}"><b>Стол ${i.tbl}</b> · ${i.qty}× ${E(dn(i.dish_id))} <small>${new Date(i.created).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})}</small><div class="row">${i.status=='new'?`<button class="btn s" onclick="st(${i.id},'cooking')">Готовится</button>`:''}<button class="btn s" onclick="st(${i.id},'ready')">Готово</button></div></div>`).join('')||'<p>Заказов нет</p>'}
const st=async(id,s)=>{await q(sb.from('order_items').update({status:s}).eq('id',id));render()};
/* ---- склад ---- */
const stT=P=>`<table><tr><th>Продукт</th><th>Склад</th><th>Кухня</th><th>Бар</th><th>Цена</th></tr>${P.map(p=>`<tr><td>${E(p.name)}, ${E(p.unit)}</td>${['s_main','s_kitchen','s_bar'].map(k=>`<td class="${p[k]<0?'bad':''}">${+(+p[k]).toFixed(3)}</td>`).join('')}<td>${M(p.price)}</td></tr>`).join('')}</table>`;
const opt=P=>P.map(p=>`<option value="${p.id}">${E(p.name)} (${E(p.unit)})</option>`).join('');
async function sv(){const P=await q(sb.from('products').select('*').order('name')),h=tabs([['st','Остатки'],['in','Приход'],['out','Выдача'],['jr','Журнал']],'st');
if(tab=='in')return h+`<div class="card row"><select id="ip">${opt(P)}</select><input id="iq" type="number" step="any" placeholder="кол-во"><input id="ic" type="number" placeholder="цена за ед."><button class="btn" onclick="mv('in')">Принять</button></div>`;
if(tab=='out')return h+`<div class="card row"><select id="ip">${opt(P)}</select><input id="iq" type="number" step="any" placeholder="кол-во"><select id="ot"><option value="s_kitchen">на кухню</option><option value="s_bar">в бар</option></select><button class="btn" onclick="mv('out')">Выдать</button></div>`;
if(tab=='jr'){const J=await q(sb.from('movements').select('*').order('t',{ascending:false}).limit(40));return h+`<table><tr><th>Время</th><th>Операция</th><th>Детали</th></tr>${J.map(m=>`<tr><td>${new Date(m.t).toLocaleString('ru')}</td><td>${E(m.kind)}</td><td>${E(m.info)}</td></tr>`).join('')}</table>`}
return h+stT(P)+`<div class="card row"><input id="np" placeholder="Новый продукт"><input id="nu" placeholder="ед." style="width:60px"><input id="npr" type="number" placeholder="цена" style="width:90px"><button class="btn s" onclick="addp()">Добавить</button></div>`}
async function mv(k){const id=$('#ip').value,n=+$('#iq').value;if(!(n>0))return;const p=await q(sb.from('products').select('*').eq('id',id).single());let u,t;
if(k=='in'){const c=+$('#ic').value;u={s_main:+p.s_main+n};if(c>0)u.price=c;t=`+${n} ${p.unit}`}else{const to=$('#ot').value;u={s_main:p.s_main-n,[to]:+p[to]+n};t=`${n} ${p.unit} → ${to=='s_bar'?'бар':'кухня'}`}
await q(sb.from('products').update(u).eq('id',id));await q(sb.from('movements').insert({kind:k=='in'?'Приход':'Выдача',info:p.name+': '+t}));tab='st';render()}
async function addp(){const name=$('#np').value;if(!name)return;await q(sb.from('products').insert({name,unit:$('#nu').value||'кг',price:+$('#npr').value||0}));render()}
/* ---- руководитель ---- */
async function bv(){const h=tabs([['rp','Отчёты'],['or','Заказы'],['wh','Склад'],['us','Сотрудники'],['sx','Затраты']],'rp');
return h+await({rp:rep,or:ors,wh:async()=>stT(await q(sb.from('products').select('*').order('name'))),us:usr,sx})[tab]()}
async function rep(){const from=per?new Date(Date.now()-per*864e5).toISOString():'1970-01-01';
const[O,R,P,S]=await Promise.all([q(sb.from('orders').select('closed,order_items(dish_id,qty)').eq('status','closed').gte('closed',from)),q(sb.from('recipes').select('*')),q(sb.from('products').select('id,price')),q(sb.from('settings').select('*'))]);
const s=Object.fromEntries(S.map(x=>[x.key,+x.val])),pr=Object.fromEntries(P.map(p=>[p.id,+p.price])),cost={},m={};R.forEach(r=>cost[r.dish_id]=(cost[r.dish_id]||0)+r.qty*(pr[r.product_id]||0));let rev=0,cg=0;
O.forEach(o=>o.order_items.forEach(i=>{const d=D.find(x=>x.id==i.dish_id),r=m[i.dish_id]||(m[i.dish_id]={n:d.name,q:0,rv:0,c:0}),c=i.qty*(cost[i.dish_id]||0);r.q+=i.qty;r.rv+=i.qty*d.price;r.c+=c;rev+=i.qty*d.price;cg+=c}));
const days=per||Math.max(1,Math.ceil((Date.now()-Math.min(Date.now(),...O.map(o=>+new Date(o.closed))))/864e5)),fx=(s.labor+s.rent+s.util)/30*days,np=rev-cg-fx;
return`<div class="row">${[[1,'Сегодня'],[7,'7 дней'],[30,'30 дней'],[0,'Всё время']].map(([k,n])=>`<button class="chip ${per==k?'on':''}" onclick="per=${k};render()">${n}</button>`).join('')}</div><div class="g2"><div class="card">Выручка<br><b>${M(rev)}</b></div><div class="card">Продукты<br><b>${M(cg)}</b></div><div class="card">Валовая прибыль<br><b>${M(rev-cg)}</b></div><div class="card">Постоянные затраты (${days} дн.)<br><b>${M(fx)}</b></div><div class="card">Итоговая прибыль<br><b class="${np<0?'bad':'ok'}">${M(np)}</b></div><div class="card">Чеков<br><b>${O.length}</b></div></div><table><tr><th>Блюдо</th><th>Порций</th><th>Выручка</th><th>Продукты</th><th>Прибыль</th></tr>${Object.values(m).sort((a,b)=>b.rv-a.rv).map(r=>`<tr><td>${E(r.n)}</td><td>${r.q}</td><td>${M(r.rv)}</td><td>${M(r.c)}</td><td>${M(r.rv-r.c)}</td></tr>`).join('')||'<tr><td colspan="5">Нет закрытых заказов</td></tr>'}</table>`}
async function ors(){const O=await q(sb.from('orders').select('*,order_items(dish_id,qty)').order('id',{ascending:false}).limit(30));
return`<table><tr><th>№</th><th>Стол</th><th>Статус</th><th>Сумма</th></tr>${O.map(o=>`<tr><td>${o.id}</td><td>${o.tbl}</td><td>${o.status=='closed'?'закрыт · '+(o.pay=='card'?'карта':'нал'):'открыт'}</td><td>${M(o.order_items.reduce((a,i)=>a+i.qty*dp(i.dish_id),0))}</td></tr>`).join('')}</table>`}
async function usr(){const U=await q(sb.from('profiles').select('*').order('name')),ro=v=>Object.entries(RN).map(([k,n])=>`<option value="${k}" ${k==v?'selected':''}>${n}</option>`).join('');
return`<table><tr><th>Логин</th><th>Роль</th></tr>${U.map(u=>`<tr><td>${E(u.name)}</td><td><select onchange="setr('${u.id}',this.value)">${ro(u.role)}</select></td></tr>`).join('')}</table><div class="card row"><input id="nl" placeholder="Логин"><input id="npw" placeholder="Пароль (от 6 символов)"><select id="nr">${ro('waiter')}</select><button class="btn s" onclick="addu()">Создать</button></div><small>Роль «Без роли» закрывает доступ сотруднику.</small>`}
const setr=async(id,r)=>{await q(sb.from('profiles').update({role:r}).eq('id',id))};
async function addu(){const l=$('#nl').value.trim().toLowerCase(),pw=$('#npw').value;if(!l||pw.length<6)return alert('Логин и пароль от 6 символов');
const c=supabase.createClient(URL_,KEY,{auth:{persistSession:false,autoRefreshToken:false}}),{data,error}=await c.auth.signUp({email:l+'@niet.cafe',password:pw});if(error)return alert(error.message);
await q(sb.from('profiles').update({role:$('#nr').value}).eq('id',data.user.id));render()}
async function sx(){const S=await q(sb.from('settings').select('*')),n={labor:'Персонал (ФОТ)',rent:'Аренда',util:'Коммунальные',portions:'План порций'};
return`<div class="card">${S.map(x=>`<div class="row"><span style="width:180px">${n[x.key]||x.key}</span><input type="number" value="${x.val}" onchange="setv('${x.key}',this.value)"></div>`).join('')}</div>`}
const setv=(k,v)=>q(sb.from('settings').update({val:+v}).eq('key',k));
init();
</script></body></html>
